name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          if ls tests/*.mjs >/dev/null 2>&1; then node --test tests/*.mjs; else echo "no tests yet"; fi
      - name: Release notes check
        if: github.event_name == 'pull_request'
        run: node .github/scripts/check-release-notes.mjs "${{ github.event.pull_request.base.sha }}"
